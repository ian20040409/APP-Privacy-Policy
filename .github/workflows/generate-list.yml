name: Generate Apps List

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps.json'
      - '.github/**'

permissions:
  contents: write

jobs:
  build-list:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 掃描包含 index.html 的子資料夾並產出 apps.json
        run: |
          python3 -c "
          import os
          import json

          apps = []
          ignored = {'.github', '.git', 'assets', 'images', 'scripts', 'css', 'js'}

          # 走訪根目錄下的項目
          for entry in sorted(os.listdir('.')):
              if os.path.isdir(entry) and entry not in ignored:
                  # 確認該目錄底下有 index.html
                  if os.path.exists(os.path.join(entry, 'index.html')):
                      apps.append({
                          'name': entry,
                          'folder': entry
                      })

          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(apps, f, ensure_ascii=False, indent=2)
          "

      - name: 提交並推送 apps.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          
          # 若 apps.json 沒有變更則跳過 commit
          if git diff --staged --quiet; then
            echo "apps.json 沒有變動，跳過提交。"
          else
            git commit -m "自動更新 apps.json [skip ci]"
            git push
          fi
